spring:
  application:
    name: hospital-management
  profiles:
    default: demo
  datasource:
    url: ${HMS_DB_URL:jdbc:h2:mem:hospital;DB_CLOSE_DELAY=-1}
    username: ${HMS_DB_USER:sa}
    password: ${HMS_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # Flyway owns the schema
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

hospital:
  # Creates the first admin account on an empty database when set (production bootstrap).
  bootstrap-admin-password: ${HMS_ADMIN_PASSWORD:}

# Boot 4 moved these from server.error
spring.web.error:
  include-stacktrace: never
  include-message: never

---
spring:
  config:
    activate:
      on-profile: demo
  thymeleaf:
    cache: false
hospital:
  demo-users: true

---
spring:
  config:
    activate:
      on-profile: prod
server:
  servlet:
    session:
      cookie:
        secure: true
