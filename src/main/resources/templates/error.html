<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Error · Hospital Management</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="center">
<main class="card narrow">
  <h1 th:text="${status == 404} ? 'Not found' : (${status == 403} ? 'Not allowed' : 'Something went wrong')">Error</h1>
  <p th:text="${status == 403} ? 'Your role does not have access to that page or action.' : 'The page could not be shown.'"></p>
  <p><a th:href="@{/}">Back to the dashboard</a></p>
</main>
</body>
</html>
