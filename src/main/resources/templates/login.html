<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="center">
<main class="card narrow">
  <h1>Hospital Management</h1>
  <p class="alert" role="alert" th:if="${param.error}">Sign-in failed. Check your username and password; after 5 failed attempts, wait 15 minutes.</p>
  <p class="notice" role="status" th:if="${param.logout}">You have signed out.</p>
  <form th:action="@{/login}" method="post">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
